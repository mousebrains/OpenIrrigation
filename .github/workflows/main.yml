name: CI

on:
  push:
    branches: [ master ]
  # Every PR, including ones stacked on another PR's branch
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - run: npm install
    - run: pip install pre-commit -r requirements-dev.txt
    - run: SKIP=phpstan,ruff-check pre-commit run --all-files

  php-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: PHP syntax check
      run: |
        fail=0
        for f in $(find public_html -name '*.php'); do
          php -l "$f" || fail=1
        done
        exit $fail

  eslint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install ESLint
      run: npm install --no-save eslint@9 @eslint/js
    - name: Run ESLint
      run: npx eslint public_html/js/
    - name: npm audit
      run: npm audit --audit-level=critical

  ruff:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: pip install -r requirements-dev.txt
    - name: Run ruff
      run: ruff check scripts/ database/ tests/ tests_sql/

  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # oldest supported (pyproject) and what Debian 13 on the Pi runs
        python-version: ['3.11', '3.13']
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: pip install -r requirements-dev.txt
    - name: Run tests
      run: python -m pytest tests/ -x -q --cov=scripts --cov-report=term-missing --cov-fail-under=25

  sql-tests:
    # The SQL functions, triggers and migrations against a real PostgreSQL 17:
    # a fresh install, every migration applied twice, check_schema.py, and the
    # tests in tests_sql/.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          # throwaway container reachable only from this job: no password
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OI_TEST_PG: '1'
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGTZ: America/Los_Angeles
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: pip install -r requirements-dev.txt
    - name: Run SQL tests
      run: python -m pytest tests_sql -q

  phpstan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install PHPStan
      run: composer global require phpstan/phpstan:2.3.1  # pinned: an unpinned upgrade broke CI (#18)
    - name: Run PHPStan
      run: ~/.composer/vendor/bin/phpstan analyse --configuration phpstan.neon

  bandit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install bandit
      run: pip install bandit
    - name: Run bandit
      run: bandit -r scripts/ -c pyproject.toml

  mypy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: pip install mypy psycopg[binary]
    - name: Run mypy
      run: mypy scripts/ --ignore-missing-imports --no-strict-optional

  migration-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check migration numbering
      run: |
        nums=$(ls database/migrate_*.py 2>/dev/null | sed 's/.*migrate_0*\([0-9]*\)\.py/\1/' | sort -n)
        expected=1
        for n in $nums; do
          if [ "$n" -ne "$expected" ]; then
            echo "Gap: expected migrate_$(printf '%03d' $expected).py, found migrate_$(printf '%03d' $n).py"
            exit 1
          fi
          expected=$((expected + 1))
        done
        echo "All $((expected - 1)) migrations sequential"
